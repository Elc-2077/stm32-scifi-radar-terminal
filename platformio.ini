; PlatformIO Project Configuration File
; STM32F103RCT6 多应用模板

; ==================== 通用配置 ====================
[common]
platform = ststm32
board = genericSTM32F103RC
framework = cmsis

platform_packages =
    toolchain-gccarmnoneeabi@~1.90201.0

build_flags =
    -DSTM32F10X_HD
    -DUSE_STDPERIPH_DRIVER
    -Iinclude
    -Ilibrary
    -Ibsp/bsp_delay
    -Ibsp/bsp_st7789
    -Idrivers/mlx90640
    -Icommon
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,-Map=output.map

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; ==================== 应用程序环境 ====================

; 环境 1: Hello World 示例
[env:hello_world]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags = ${common.build_flags}
upload_protocol = ${common.upload_protocol}
debug_tool = ${common.debug_tool}
monitor_speed = ${common.monitor_speed}

build_src_filter =
    +<../applications/01_hello_world/>
    +<../bsp/bsp_delay/>
    +<../bsp/bsp_st7789/>
    +<../common/stm32f10x_it.c>
    +<../library/stm32f10x_gpio.c>
    +<../library/stm32f10x_rcc.c>
    +<../library/stm32f10x_spi.c>
    +<../library/misc.c>

; 环境 2: PD动画播放器
[env:pd_animation]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
platform_packages = ${common.platform_packages}
build_flags = ${common.build_flags}
upload_protocol = ${common.upload_protocol}
debug_tool = ${common.debug_tool}
monitor_speed = ${common.monitor_speed}

build_src_filter =
    +<../applications/02_pd_animation/>
    +<../bsp/bsp_delay/>
    +<../bsp/bsp_st7789/>
    +<../common/stm32f10x_it.c>
    +<../common/image_display.c>
    +<../library/stm32f10x_gpio.c>
    +<../library/stm32f10x_rcc.c>
    +<../library/stm32f10x_spi.c>
    +<../library/misc.c>

; 环境 3: 热成像相机（模板）
